env: "test"
log:
  level: "warn"
  output: "stdout"
storage:
  type: "postgres"
  postgres:
    host: "postgres"
    port: 5432
    name: "account_test"
    ssl_mode: "disable"
    connect_timeout: 5s
    max_retries_time: 2s
grpc:
  port: 50052
  timeout: 5s
kafka:
  brokers: "kafka:9092"
outbox:
  interval: 1h
  batch_size: 10
bank_gateway:
  failure_rate: 0.0
