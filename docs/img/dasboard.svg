<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .window { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .bar { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .header-nav { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 6; }
      .title { font-family: ui-monospace, monospace, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .label { font-family: ui-monospace, monospace, sans-serif; font-size: 11px; fill: #64748b; }
      .balance { font-family: ui-monospace, monospace, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .btn { fill: #334155; rx: 4; }
      .btn-outline { fill: #ffffff; stroke: #475569; stroke-width: 1; rx: 4; }
      .btn-text { font-family: ui-monospace, monospace, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .btn-text-dark { font-family: ui-monospace, monospace, sans-serif; font-size: 11px; font-weight: bold; fill: #334155; text-anchor: middle; }
      .th { font-family: ui-monospace, monospace, sans-serif; font-size: 10px; font-weight: bold; fill: #475569; }
      .td { font-family: ui-monospace, monospace, sans-serif; font-size: 10px; fill: #1e293b; }
      .badge-ok { fill: #f0fdf4; stroke: #86efac; stroke-width: 1; rx: 3; }
      .badge-text-ok { font-family: ui-monospace, monospace, sans-serif; font-size: 9px; fill: #15803d; }
      .hint { font-family: ui-monospace, monospace, sans-serif; font-size: 10px; fill: #64748b; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="800" height="520" class="bg"/>
  <rect x="20" y="15" width="760" height="490" class="window"/>
  <rect x="20" y="15" width="760" height="30" class="bar"/>
  <text x="400" y="34" class="hint" text-anchor="middle">Wireframe #2 — Corporate Dashboard (/dashboard)</text>

  <!-- Top App Navigation -->
  <rect x="20" y="45" width="760" height="36" class="header-nav"/>
  <text x="40" y="68" class="title">GoFlow Pay</text>
  <text x="140" y="68" class="title" font-size="11">[Дашборд]</text>
  <text x="220" y="68" class="label">Счета</text>
  <text x="280" y="68" class="label">Платежи</text>
  <text x="355" y="68" class="label">История</text>
  <rect x="540" y="52" width="220" height="22" fill="#f1f5f9" stroke="#cbd5e1" rx="3"/>
  <text x="650" y="67" class="hint" text-anchor="middle">ООО "ТехноПром" (ID: 1042) ▼</text>

  <!-- Section 1: Multi-Currency Account Cards -->
  <text x="40" y="105" class="title">Мультивалютные счета организации</text>
  
  <!-- USD Card -->
  <rect x="40" y="115" width="225" height="85" class="card"/>
  <text x="55" y="135" class="label">Основной счет (USD)</text>
  <rect x="205" y="125" width="50" height="15" class="badge-ok"/>
  <text x="230" y="136" class="badge-text-ok" text-anchor="middle">ACTIVE</text>
  <text x="55" y="165" class="balance">$ 124,500.00</text>
  <text x="55" y="185" class="hint">ACC-8942-USD</text>

  <!-- EUR Card -->
  <rect x="285" y="115" width="225" height="85" class="card"/>
  <text x="300" y="135" class="label">Европейский счет (EUR)</text>
  <rect x="450" y="125" width="50" height="15" class="badge-ok"/>
  <text x="475" y="136" class="badge-text-ok" text-anchor="middle">ACTIVE</text>
  <text x="300" y="165" class="balance">€ 45,210.50</text>
  <text x="300" y="185" class="hint">ACC-3104-EUR</text>

  <!-- RUB Card -->
  <rect x="530" y="115" width="230" height="85" class="card"/>
  <text x="545" y="135" class="label">Локальный счет (RUB)</text>
  <rect x="695" y="125" width="50" height="15" class="badge-ok"/>
  <text x="720" y="136" class="badge-text-ok" text-anchor="middle">ACTIVE</text>
  <text x="545" y="165" class="balance">₽ 3,420,000.00</text>
  <text x="545" y="185" class="hint">ACC-7719-RUB</text>

  <!-- Quick Actions Bar -->
  <rect x="40" y="215" width="150" height="32" class="btn"/>
  <text x="115" y="235" class="btn-text">+ Новый платёж</text>
  <rect x="205" y="215" width="130" height="32" class="btn-outline"/>
  <text x="270" y="235" class="btn-text-dark">↑ Пополнить счет</text>
  <rect x="350" y="215" width="130" height="32" class="btn-outline"/>
  <text x="415" y="235" class="btn-text-dark">↓ Вывести средства</text>

  <!-- Section 2: Recent 5 Transactions Widget -->
  <text x="40" y="275" class="title">Последние 5 операций</text>
  <text x="680" y="275" class="hint">Все операции →</text>
  
  <rect x="40" y="285" width="720" height="200" class="card"/>
  <!-- Table Header -->
  <rect x="40" y="285" width="720" height="26" fill="#f8fafc"/>
  <text x="55" y="302" class="th">ДАТА / ВРЕМЯ</text>
  <text x="170" y="302" class="th">СЧЕТ СПИСАНИЯ</text>
  <text x="300" y="302" class="th">КОНТРАГЕНТ / ОПИСАНИЕ</text>
  <text x="530" y="302" class="th">СУММА</text>
  <text x="670" y="302" class="th">СТАТУС</text>
  <line x1="40" y1="311" x2="760" y2="311" class="divider"/>

  <!-- Row 1 -->
  <text x="55" y="330" class="td">16.09.26 14:32</text>
  <text x="170" y="330" class="td">ACC-8942-USD</text>
  <text x="300" y="330" class="td">ООО "Логистик Плюс"</text>
  <text x="530" y="330" class="td" font-weight="bold">- $15,000.00</text>
  <rect x="665" y="320" width="65" height="14" class="badge-ok"/><text x="697" y="331" class="badge-text-ok" text-anchor="middle">completed</text>
  <line x1="40" y1="344" x2="760" y2="344" class="divider"/>

  <!-- Row 2 -->
  <text x="55" y="362" class="td">16.09.26 11:15</text>
  <text x="170" y="362" class="td">Bank Deposit</text>
  <text x="300" y="362" class="td">Пополнение счета #981</text>
  <text x="530" y="362" class="td" font-weight="bold">+ $50,000.00</text>
  <rect x="665" y="352" width="65" height="14" class="badge-ok"/><text x="697" y="363" class="badge-text-ok" text-anchor="middle">completed</text>
  <line x1="40" y1="376" x2="760" y2="376" class="divider"/>

  <!-- Row 3 -->
  <text x="55" y="394" class="td">15.09.26 18:20</text>
  <text x="170" y="394" class="td">ACC-3104-EUR</text>
  <text x="300" y="394" class="td">Cloud Infrastructure Ltd</text>
  <text x="530" y="394" class="td" font-weight="bold">- €1,240.00</text>
  <rect x="665" y="384" width="65" height="14" class="badge-ok"/><text x="697" y="395" class="badge-text-ok" text-anchor="middle">completed</text>
  <line x1="40" y1="408" x2="760" y2="408" class="divider"/>

  <!-- Row 4 -->
  <text x="55" y="426" class="td">15.09.26 16:05</text>
  <text x="170" y="426" class="td">ACC-8942-USD</text>
  <text x="300" y="426" class="td">Tech Equipments Inc</text>
  <text x="530" y="426" class="td" font-weight="bold">- $4,800.00</text>
  <rect x="665" y="416" width="65" height="14" fill="#fefce8" stroke="#fde047" rx="3"/><text x="697" y="427" font-size="9" fill="#a16207" font-family="ui-monospace, monospace" text-anchor="middle">pending</text>
  <line x1="40" y1="440" x2="760" y2="440" class="divider"/>

  <!-- Row 5 -->
  <text x="55" y="458" class="td">14.09.26 12:40</text>
  <text x="170" y="458" class="td">ACC-7719-RUB</text>
  <text x="300" y="458" class="td">Аренда офиса сентябрь</text>
  <text x="530" y="458" class="td" font-weight="bold">- ₽250,000.00</text>
  <rect x="665" y="448" width="65" height="14" class="badge-ok"/><text x="697" y="459" class="badge-text-ok" text-anchor="middle">completed</text>
</svg>
