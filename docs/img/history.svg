<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .window { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .bar { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .title { font-family: ui-monospace, monospace, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .label { font-family: ui-monospace, monospace, sans-serif; font-size: 11px; fill: #475569; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 6; }
      .input { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 4; }
      .val-text { font-family: ui-monospace, monospace, sans-serif; font-size: 10px; fill: #1e293b; }
      .th { font-family: ui-monospace, monospace, sans-serif; font-size: 10px; font-weight: bold; fill: #475569; }
      .td { font-family: ui-monospace, monospace, sans-serif; font-size: 10px; fill: #1e293b; }
      .badge-ok { fill: #f0fdf4; stroke: #86efac; stroke-width: 1; rx: 3; }
      .badge-text-ok { font-family: ui-monospace, monospace, sans-serif; font-size: 9px; fill: #15803d; }
      .badge-pend { fill: #fefce8; stroke: #fde047; stroke-width: 1; rx: 3; }
      .badge-text-pend { font-family: ui-monospace, monospace, sans-serif; font-size: 9px; fill: #a16207; }
      .badge-fail { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1; rx: 3; }
      .badge-text-fail { font-family: ui-monospace, monospace, sans-serif; font-size: 9px; fill: #b91c1c; }
      .hint { font-family: ui-monospace, monospace, sans-serif; font-size: 10px; fill: #64748b; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
      .page-btn { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3; }
      .page-active { fill: #0f172a; rx: 3; }
    </style>
  </defs>

