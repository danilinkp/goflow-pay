apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  labels:
    app: accounts
    {{- include "goflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apps.accounts.replicaCount }}
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      containers:
        - name: accounts
          image: "{{ .Values.apps.accounts.image.repository }}:{{ .Values.apps.accounts.image.tag }}"
          imagePullPolicy: {{ .Values.apps.accounts.image.pullPolicy }}
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: CONFIG_PATH
              value: "/app/config/local.yaml"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: goflow-secrets
                  key: DB_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: goflow-secrets
                  key: DB_PASSWORD
          resources:
            {{- toYaml .Values.apps.accounts.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config/local.yaml
              subPath: local.yaml
      volumes:
        - name: config
          configMap:
            name: accounts-config
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-service
  labels:
    {{- include "goflow.labels" . | nindent 4 }}
spec:
  selector:
    app: accounts
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
