apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    {{- include "goflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apps.gateway.replicaCount }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.apps.gateway.image.repository }}:{{ .Values.apps.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.apps.gateway.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CONFIG_PATH
              value: "/app/config/local.yaml"
            - name: JWT_PUBLIC_KEY_PATH
              value: "/app/certs/public.pem"
            - name: BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: goflow-secrets
                  key: BOOTSTRAP_TOKEN
          resources:
            {{- toYaml .Values.apps.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config/local.yaml
              subPath: local.yaml
            - name: certs
              mountPath: /app/certs/public.pem
              subPath: public.pem
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: certs
          secret:
            secretName: goflow-secrets
            items:
              - key: jwt-public.pem
                path: public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    {{- include "goflow.labels" . | nindent 4 }}
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
