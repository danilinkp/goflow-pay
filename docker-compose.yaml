version: '3.8'

services:
  postgres-auth:
    container_name: postgres_auth_container
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U postgres -d auth_service'" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - my_persistent_network

  redis:
    image: redis:8-alpine
    container_name: blacklist-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - blacklist_redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - my_persistent_network
