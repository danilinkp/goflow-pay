server_tokens off;
more_set_headers "Server: GoFlow Pay";

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml application/yaml text/yaml application/x-yaml;

proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m
                 max_size=200m inactive=1h use_temp_path=off;

map $uri $static_cache_control {
    ~^(/mirror)?/legacy/assets/                   "public, max-age=31536000, immutable";
    ~\.(?:svg|png|jpe?g|gif|ico|webp|woff2?)$     "public, max-age=86400";
    ~\.(?:css|js)$                                "public, max-age=3600";
    default                                       "no-cache";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

geo $loadtest_client {
    default         0;
    172.29.250.0/24 1;
    172.29.250.1    0;
}

map $loadtest_client $api_limit_key {
    1       "";
    default $binary_remote_addr;
}

limit_req_zone $api_limit_key zone=api:10m rate=10r/s;
limit_req_status 429;

log_format upstream '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr rt=$upstream_response_time';

resolver 127.0.0.11 valid=10s ipv6=off;

map $request_method $api_upstream {
    GET     api_read;
    HEAD    api_read;
    default api_write;
}

upstream gateway {
    zone gateway 64k;
    server gateway:8080 resolve;
}

upstream api_read {
    zone api_read 64k;
    server gateway:8080 weight=2 resolve;
    server gateway-ro-1:8080 weight=1 resolve;
    server gateway-ro-2:8080 weight=1 resolve;
}

upstream api_write {
    zone api_write 64k;
    server gateway:8080 resolve;
}

map $request_method $mirror_rw_cookie {
    GET     "";
    HEAD    "";
    default "mirror_rw=1; Path=/mirror/; Max-Age=5; HttpOnly; SameSite=Lax";
}

map "$request_method:$cookie_mirror_rw" $mirror_upstream {
    ~^(GET|HEAD):1$ api_read;
    ~^(GET|HEAD):   mirror_read;
    default         api_write;
}

upstream mirror_read {
    zone mirror_read 64k;
    server gateway-mirror:8080 weight=2 resolve;
    server gateway-mirror-ro-1:8080 weight=1 resolve;
    server gateway-mirror-ro-2:8080 weight=1 resolve;
}

upstream mirror_gateway {
    zone mirror_gateway 64k;
    server gateway-mirror:8080 resolve;
}

upstream legacy_frontend_mirror {
    zone legacy_frontend_mirror 64k;
    server frontend-mirror:80 resolve;
}

upstream swagger_ui_mirror {
    zone swagger_ui_mirror 64k;
    server swagger-ui-mirror:8080 resolve;
}

upstream legacy_frontend {
    zone legacy_frontend 64k;
    server frontend:80 resolve;
}

upstream swagger_ui {
    zone swagger_ui 64k;
    server swagger-ui:8080 resolve;
}

upstream db_admin {
    zone db_admin 64k;
    server adminer:8080 resolve;
}

upstream grafana {
    zone grafana 64k;
    server grafana:3000 resolve;
}

server {
    listen 80;
    server_name _;

    charset utf-8;

    proxy_http_version 1.1;
    include /etc/nginx/snippets/proxy-headers.conf;

    root /usr/share/nginx/static;

    location / {
        add_header Cache-Control $static_cache_control;
        try_files $uri $uri/ =404;
    }

    location /reserved/ {
        alias /usr/share/nginx/static/;
        add_header Cache-Control $static_cache_control;
        try_files $uri $uri/ =404;
    }

    location = /reserved {
        return 301 /reserved/;
    }

    location = /management {
        include /etc/nginx/snippets/no-store.conf;
        try_files /management.html =404;
    }

    location = /documentation {
        alias /usr/share/nginx/docs/README.md;
        default_type text/plain;
        add_header Cache-Control $static_cache_control;
    }

    location = /api/v2/docs {
        include /etc/nginx/snippets/static-proxy-cache.conf;
        proxy_pass http://swagger_ui;
    }

    location /api/v2/docs/ {
        include /etc/nginx/snippets/static-proxy-cache.conf;
        proxy_pass http://swagger_ui;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        access_log /var/log/nginx/access.log upstream;
        include /etc/nginx/snippets/no-store.conf;
        add_header X-Upstream $upstream_addr always;
        proxy_pass http://$api_upstream;
    }

    location = /legacy {
        return 301 /legacy/;
    }

    location /legacy/ {
        include /etc/nginx/snippets/static-proxy-cache.conf;
        proxy_pass http://legacy_frontend/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        include /etc/nginx/snippets/admin-access.conf;
        include /etc/nginx/snippets/no-store.conf;
        auth_basic "GoFlow Pay DB admin";
        auth_basic_user_file /etc/nginx/secrets/.htpasswd;
        proxy_pass http://db_admin;
    }

    location = /monitoring {
        return 301 /monitoring/;
    }

    location /monitoring/ {
        include /etc/nginx/snippets/admin-access.conf;
        include /etc/nginx/snippets/no-store.conf;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://grafana;
    }

    location = /mailpit {
        return 301 /mailpit/;
    }

    location /mailpit/ {
        include /etc/nginx/snippets/no-store.conf;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://mailpit:8025;
    }

    location = /mirror {
        return 301 /mirror/;
    }

    location /mirror/ {
        alias /usr/share/nginx/static/;
        add_header Cache-Control $static_cache_control;
        try_files $uri $uri/ =404;
        sub_filter_once off;
        sub_filter 'href="/legacy/' 'href="/mirror/legacy/';
        sub_filter 'src="/img/' 'src="/mirror/img/';
    }

    location /mirror/api/ {
        limit_req zone=api burst=20 nodelay;
        access_log /var/log/nginx/access.log upstream;
        include /etc/nginx/snippets/no-store.conf;
        add_header X-Upstream $upstream_addr always;
        add_header Set-Cookie $mirror_rw_cookie;
        rewrite ^/mirror(/api/.*)$ $1 break;
        proxy_pass http://$mirror_upstream;
    }

    location = /mirror/api/v2/docs {
        include /etc/nginx/snippets/static-proxy-cache.conf;
        proxy_pass http://swagger_ui_mirror;
    }

    location ^~ /mirror/api/v2/docs/ {
        include /etc/nginx/snippets/static-proxy-cache.conf;
        proxy_pass http://swagger_ui_mirror;
    }

    location = /mirror/api/v2/docs/openapi.yaml {
        include /etc/nginx/snippets/static-proxy-cache.conf;
        proxy_pass http://swagger_ui_mirror;
        sub_filter_types *;
        sub_filter 'url: /' 'url: /mirror';
    }

    location = /mirror/legacy {
        return 301 /mirror/legacy/;
    }

    location /mirror/legacy/ {
        include /etc/nginx/snippets/static-proxy-cache.conf;
        proxy_pass http://legacy_frontend_mirror/;
    }

    location = /mirror/health {
        include /etc/nginx/snippets/no-store.conf;
        proxy_pass http://mirror_gateway/health;
    }

    location = /mirror/ready {
        include /etc/nginx/snippets/no-store.conf;
        proxy_pass http://mirror_gateway/ready;
    }

    location = /status {
        include /etc/nginx/snippets/no-store.conf;
        stub_status;
    }

    location = /health {
        include /etc/nginx/snippets/no-store.conf;
        proxy_pass http://gateway;
    }

    location = /ready {
        include /etc/nginx/snippets/no-store.conf;
        proxy_pass http://gateway;
    }
}
