limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream gateway {
    server gateway:8080;
}

upstream legacy_frontend {
    server frontend:80;
}

upstream swagger_ui {
    server swagger-ui:8080;
}

upstream db_admin {
    server adminer:8080;
}

server {
    listen 80;
    server_name _;

    charset utf-8;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    root /usr/share/nginx/static;

    location / {
        try_files $uri $uri/ =404;
    }

    location /reserved/ {
        alias /usr/share/nginx/static/;
        try_files $uri $uri/ =404;
    }

    location = /reserved {
        return 301 /reserved/;
    }

    location = /management {
        try_files /management.html =404;
    }

    location = /documentation {
        alias /usr/share/nginx/docs/README.md;
        default_type "text/plain; charset=utf-8";
    }

    location = /api/v2/docs {
        proxy_pass http://swagger_ui;
    }

    location /api/v2/docs/ {
        proxy_pass http://swagger_ui;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://gateway;
    }

    location = /legacy {
        return 301 /legacy/;
    }

    location /legacy/ {
        proxy_pass http://legacy_frontend/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        include /etc/nginx/snippets/admin-access.conf;
        auth_basic "GoFlow Pay DB admin";
        auth_basic_user_file /etc/nginx/secrets/.htpasswd;
        proxy_pass http://db_admin;
    }

    location = /status {
        stub_status;
    }

    location = /health {
        proxy_pass http://gateway;
    }

    location = /ready {
        proxy_pass http://gateway;
    }
}
