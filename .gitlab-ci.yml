stages:
  - build-test-image
  - unit-test
  - integration-test
  - e2e-test
  - report

default:
  tags:
    - my-runner

variables:
  GOPATH: $CI_PROJECT_DIR/.go

# ==============================================================================
# 1. Сборка изолированного тестового контейнера (Требование №1 ТЗ)
# ==============================================================================
build-test-image:
  stage: build-test-image
  image: docker:26
  script:
    - docker build -f Dockerfile.test -t goflow-test-runner:ci .
    - docker compose -f docker-compose.test.yml build auth accounts transactions gateway

# ==============================================================================
# 2. Модульное тестирование (Требование №5: Порядок unit -> integration -> e2e)
# ==============================================================================
unit-tests:
  stage: unit-test
  image: docker:26
  needs: [build-test-image]
  script:
    - mkdir -p reports/allure-results
    - docker run --name unit-runner -e ALLURE_RESULTS_DIR=/app/reports/allure-results goflow-test-runner:ci make test
  after_script:
    - docker cp unit-runner:/app/reports/allure-results/. reports/allure-results/ || true
    - chmod -R 777 reports/allure-results || true
    - docker rm -f unit-runner || true
  artifacts:
    when: always
    paths:
      - reports/allure-results/
    expire_in: 1 day

# ==============================================================================
# 3. Интеграционное тестирование (Требования №2, 3, 4, 10, 11, 12, 14, 15)
# ==============================================================================
integration-tests:
  stage: integration-test
  image: docker:26
  needs: [unit-tests]
  script:
    - mkdir -p reports/allure-results
    - docker compose -f docker-compose.test.yml down -v || true
    - docker compose -f docker-compose.test.yml up -d --wait postgres-test redis-test
    - docker compose -f docker-compose.test.yml run --name integ-runner test-runner sh -c "ALLURE_RESULTS_DIR=/app/reports/allure-results make test-integration"
  after_script:
    - docker cp integ-runner:/app/reports/allure-results/. reports/allure-results/ || true
    - chmod -R 777 reports/allure-results || true
    - docker rm -f integ-runner || true
    - docker compose -f docker-compose.test.yml down -v
  artifacts:
    when: always
    paths:
      - reports/allure-results/
    expire_in: 1 day

# ==============================================================================
# 4. Сквозное системное тестирование E2E (Требования №5, 6, 10, 11, 12)
# ==============================================================================
e2e-tests:
  stage: e2e-test
  image: docker:26
  needs: [integration-tests]
  script:
    - mkdir -p reports/allure-results
    - docker compose -f docker-compose.test.yml down -v || true
    - docker compose -f docker-compose.test.yml up -d --wait gateway
    - ALLURE_RESULTS_DIR=reports/allure-results ./scripts/run_e2e_client.sh
  after_script:
    - chmod -R 777 reports/allure-results || true
    - docker compose -f docker-compose.test.yml logs --no-color stand-init auth accounts transactions gateway > reports/e2e-stand.log 2>&1 || true
    - docker compose -f docker-compose.test.yml down -v
  artifacts:
    when: always
    paths:
      - reports/allure-results/
      - reports/e2e-stand.log
    expire_in: 1 day

# ==============================================================================
# 5. Автоматическая генерация Allure-отчёта с трендами (Требования №8, 9)
# ==============================================================================
generate-report:
  stage: report
  image:
    name: frankescobar/allure-docker-service:latest
    entrypoint: [""]
  when: always
  needs:
    - job: unit-tests
      artifacts: true
    - job: integration-tests
      artifacts: true
      optional: true
    - job: e2e-tests
      artifacts: true
      optional: true
  cache:
    key: allure-history-trend
    paths:
      - reports/allure-report/history/
  script:
    # 1. Помечаем непрошедшие этапы как skipped (Требование №8)
    - chmod -R 777 reports/allure-results 2>/dev/null || true
    - ./scripts/mark_skipped_tests.sh reports/allure-results
    # 2. Подтягиваем историю для графиков тренда (Требование №9)
    - mkdir -p reports/allure-results/history
    - test -d reports/allure-report/history && cp -r reports/allure-report/history/* reports/allure-results/history/ 2>/dev/null || true
    # 3. Метаданные сборки с кликабельными ссылками на пайплайн и отчёт
    - |
      cat <<EOF > reports/allure-results/executor.json
      {
        "name": "GitLab CI",
        "type": "gitlab",
        "url": "${CI_PROJECT_URL}",
        "buildOrder": ${CI_PIPELINE_IID:-1},
        "buildName": "Pipeline #${CI_PIPELINE_IID:-1}",
        "buildUrl": "${CI_PIPELINE_URL}",
        "reportUrl": "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/reports/allure-report/index.html",
        "reportName": "GoFlow Pay Allure Report"
      }
      EOF
    # 4. Обновление накопительной истории трендов
    - allure generate reports/allure-results -o reports/allure-cache --clean
    - mkdir -p reports/allure-report/history
    - cp -r reports/allure-cache/history/* reports/allure-results/history/ 2>/dev/null || true
    - cp -r reports/allure-cache/history reports/allure-report/
    # 5. Сборка автономного Single-Page HTML (открывается в браузере в 1 клик без локальных веб-серверов)
    - allure generate reports/allure-results -o reports/allure-report --clean --single-file
    - cp -r reports/allure-cache/history reports/allure-report/
    - rm -rf reports/allure-cache
  artifacts:
    name: "allure-report-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - reports/allure-report/
    expire_in: 1 week
