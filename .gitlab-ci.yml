stages:
  - lint
  - unit-test
  - integration-test
  - e2e-test
  - security
  - build

default:
  tags:
    - my-runner

variables:
  GOPATH: $CI_PROJECT_DIR/.go

.go-cache:
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/mod/

.lint-go:
  extends: .go-cache
  stage: lint
  image: golang:1.25
  before_script:
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin
  script:
    - cd services/$SERVICE && golangci-lint run ./...

lint-auth:
  extends: .lint-go
  variables:
    SERVICE: auth
  rules:
    - changes:
        - services/auth/**/*
        - .gitlab-ci.yml

lint-accounts:
  extends: .lint-go
  variables:
    SERVICE: accounts
  rules:
    - changes:
        - services/accounts/**/*
        - .gitlab-ci.yml

lint-transactions:
  extends: .lint-go
  variables:
    SERVICE: transactions
  rules:
    - changes:
        - services/transactions/**/*
        - .gitlab-ci.yml

lint-notifications:
  extends: .lint-go
  variables:
    SERVICE: notifications
  rules:
    - changes:
        - services/notifications/**/*
        - .gitlab-ci.yml

lint-gateway:
  extends: .lint-go
  variables:
    SERVICE: gateway
  rules:
    - changes:
        - services/gateway/**/*
        - .gitlab-ci.yml

lint-helm:
  stage: lint
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  script:
    - helm lint deploy/helm/goflow
    - helm template goflow deploy/helm/goflow > /dev/null
  rules:
    - changes:
        - deploy/helm/**/*
        - .gitlab-ci.yml

# ==============================================================================
# Пирамида тестирования (ЛР №2: Модульные -> Интеграционные -> Сквозные E2E)
# ==============================================================================

# Уровень 1: Модульные тесты (Лондонская и Классическая школы, solitary/mock)
unit-tests:
  extends: .go-cache
  stage: unit-test
  image: golang:1.25
  script:
    - echo "=== Запуск быстрых модульных тестов (London + Classic) ==="
    - make test

test-frontend:
  stage: unit-test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

# Уровень 2: Интеграционные тесты (AccountService + Real PostgreSQL)
integration-tests:
  stage: integration-test
  image: docker:26
  needs: [unit-tests]
  script:
    - echo "=== Запуск тестовой инфраструктуры БД (PostgreSQL + Redis) ==="
    - docker compose -f docker-compose.test.yml up -d --wait postgres-test redis-test
    - echo "=== Выполнение интеграционных тестов бизнес-логики с PostgreSQL ==="
    - docker compose -f docker-compose.test.yml run --rm test-runner make test-integration
  after_script:
    - echo "=== Очистка тестового стенда (Teardown) ==="
    - docker compose -f docker-compose.test.yml down -v

# Уровень 3: Сквозные тесты (E2E Black-Box через Gateway) + Захват трафика в PCAP (п. 5 методички)
e2e-tests:
  stage: e2e-test
  image: docker:26
  needs: [integration-tests]
  script:
    - echo "=== Запуск тестовой инфраструктуры БД (PostgreSQL + Redis) ==="
    - docker compose -f docker-compose.test.yml up -d --wait postgres-test redis-test
    - echo "=== Запуск сквозного сценария перевода и финансовой выписки с захватом сетевого трафика ==="
    - docker compose -f docker-compose.test.yml run --rm test-runner make capture-traffic
  after_script:
    - echo "=== Очистка тестового стенда (Teardown) ==="
    - docker compose -f docker-compose.test.yml down -v
  artifacts:
    name: "traffic-capture-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - reports/traffic_capture.pcap
    expire_in: 1 week

# ==============================================================================
# Безопасность и сборка
# ==============================================================================

security-gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --no-git --source .
  allow_failure: true

.build:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - IMAGE_TAG=${CI_REGISTRY_IMAGE:-goflow}/$SERVICE
    - docker build -f services/$SERVICE/Dockerfile -t $IMAGE_TAG:$CI_COMMIT_SHA -t $IMAGE_TAG:latest .
    - |
      if [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_USER" ]; then
        echo "Logging into $CI_REGISTRY..."
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_TAG:$CI_COMMIT_SHA"
        docker push "$IMAGE_TAG:latest"
      else
        echo "No CI_REGISTRY configured, skipping docker push"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-auth:
  extends: .build
  variables:
    SERVICE: auth

build-accounts:
  extends: .build
  variables:
    SERVICE: accounts

build-transactions:
  extends: .build
  variables:
    SERVICE: transactions

build-notifications:
  extends: .build
  variables:
    SERVICE: notifications

build-gateway:
  extends: .build
  variables:
    SERVICE: gateway

build-frontend:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - IMAGE_TAG=${CI_REGISTRY_IMAGE:-goflow}/frontend
    - docker build -f frontend/Dockerfile -t $IMAGE_TAG:$CI_COMMIT_SHA -t $IMAGE_TAG:latest ./frontend
    - |
      if [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_USER" ]; then
        echo "Logging into $CI_REGISTRY..."
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_TAG:$CI_COMMIT_SHA"
        docker push "$IMAGE_TAG:latest"
      else
        echo "No CI_REGISTRY configured, skipping docker push"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
