stages:
  - unit-test
  - integration-test
  - e2e-test

default:
  tags:
    - my-runner

variables:
  GOPATH: $CI_PROJECT_DIR/.go

.go-cache:
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/mod/

# ==============================================================================
# Пирамида тестирования (ЛР №2: Модульные -> Интеграционные -> Сквозные E2E)
# ==============================================================================

# 1. Модульное тестирование (Лондонская и Классическая школы, solitary/mock)
unit-tests:
  extends: .go-cache
  stage: unit-test
  image: golang:1.25
  script:
    - make test

# 2. Интеграционное тестирование (БД PostgreSQL + транзакции + outbox)
integration-tests:
  stage: integration-test
  image: docker:26
  needs: [unit-tests]
  script:
    - docker compose -f docker-compose.test.yml down -v || true
    - docker compose -f docker-compose.test.yml up -d --wait postgres-test redis-test
    - docker compose -f docker-compose.test.yml run --rm --build test-runner make test-integration
  after_script:
    - docker compose -f docker-compose.test.yml down -v

# 3. Сквозное системное тестирование (E2E через Gateway HTTP API)
e2e-tests:
  stage: e2e-test
  image: docker:26
  needs: [integration-tests]
  script:
    - docker compose -f docker-compose.test.yml down -v || true
    - docker compose -f docker-compose.test.yml up -d --wait postgres-test redis-test
    - docker compose -f docker-compose.test.yml run --rm --build test-runner make test-e2e
  after_script:
    - docker compose -f docker-compose.test.yml down -v
