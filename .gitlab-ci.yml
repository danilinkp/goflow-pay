stages:
  - lint
  - test
  - build

variables:
  GOPATH: $CI_PROJECT_DIR/.go

.go-cache:
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/mod/

.lint:
  extends: .go-cache
  stage: lint
  image: golangci/golangci-lint:latest
  tags:
    - testing-docker
  script:
    - cd services/$SERVICE && golangci-lint run ./...

lint-auth:
  extends: .lint
  variables:
    SERVICE: auth

lint-accounts:
  extends: .lint
  variables:
    SERVICE: accounts

lint-transactions:
  extends: .lint
  variables:
    SERVICE: transactions

lint-notifications:
  extends: .lint
  variables:
    SERVICE: notifications

lint-gateway:
  extends: .lint
  variables:
    SERVICE: gateway

test:
  extends: .go-cache
  stage: test
  image: golang:1.25
  tags:
    - testing-docker
  script:
    - go test ./services/accounts/internal/domain/...
    - go test ./services/accounts/internal/services/...
    - go test ./services/notifications/internal/service/...
    - go test ./services/auth/internal/domain/...
    - go test ./services/auth/internal/services/...
    - go test ./services/transactions/internal/domain/...
    - go test ./services/transactions/internal/service/...

.build:
  stage: build
  image: docker:26
  tags:
    - testing-docker
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - >
      docker build
      -f services/$SERVICE/Dockerfile
      -t $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
      -t $CI_REGISTRY_IMAGE/$SERVICE:latest
      .
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-auth:
  extends: .build
  variables:
    SERVICE: auth

build-accounts:
  extends: .build
  variables:
    SERVICE: accounts

build-transactions:
  extends: .build
  variables:
    SERVICE: transactions

build-notifications:
  extends: .build
  variables:
    SERVICE: notifications

build-gateway:
  extends: .build
  variables:
    SERVICE: gateway
