stages:
  - lint
  - test
  - security
  - build

default:
  tags:
    - my-runner

variables:
  GOPATH: $CI_PROJECT_DIR/.go

.go-cache:
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/mod/

.lint-go:
  extends: .go-cache
  stage: lint
  image: golang:1.25
  before_script:
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin
  script:
    - cd services/$SERVICE && golangci-lint run ./...

lint-auth:
  extends: .lint-go
  variables:
    SERVICE: auth
  rules:
    - changes:
        - services/auth/**/*
        - .gitlab-ci.yml

lint-accounts:
  extends: .lint-go
  variables:
    SERVICE: accounts
  rules:
    - changes:
        - services/accounts/**/*
        - .gitlab-ci.yml

lint-transactions:
  extends: .lint-go
  variables:
    SERVICE: transactions
  rules:
    - changes:
        - services/transactions/**/*
        - .gitlab-ci.yml

lint-notifications:
  extends: .lint-go
  variables:
    SERVICE: notifications
  rules:
    - changes:
        - services/notifications/**/*
        - .gitlab-ci.yml

lint-gateway:
  extends: .lint-go
  variables:
    SERVICE: gateway
  rules:
    - changes:
        - services/gateway/**/*
        - .gitlab-ci.yml

lint-helm:
  stage: lint
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  script:
    - helm lint deploy/helm/goflow
    - helm template goflow deploy/helm/goflow > /dev/null
  rules:
    - changes:
        - deploy/helm/**/*
        - .gitlab-ci.yml

test-go:
  extends: .go-cache
  stage: test
  image: golang:1.25
  script:
    - go test ./services/accounts/internal/...
    - go test ./services/notifications/internal/...
    - go test ./services/auth/internal/...
    - go test ./services/transactions/internal/...

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

security-gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --no-git --source .
  allow_failure: true

.build:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - >
      docker build
      -f services/$SERVICE/Dockerfile
      -t $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
      -t $CI_REGISTRY_IMAGE/$SERVICE:latest
      .
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-auth:
  extends: .build
  variables:
    SERVICE: auth

build-accounts:
  extends: .build
  variables:
    SERVICE: accounts

build-transactions:
  extends: .build
  variables:
    SERVICE: transactions

build-notifications:
  extends: .build
  variables:
    SERVICE: notifications

build-gateway:
  extends: .build
  variables:
    SERVICE: gateway

build-frontend:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - >
      docker build
      -f frontend/Dockerfile
      -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
      -t $CI_REGISTRY_IMAGE/frontend:latest
      ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
