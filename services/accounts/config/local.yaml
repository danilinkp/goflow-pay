env: "local"

log:
  level: debug
  output: stdout
  file: logs/app.log

db:
  host: postgres-accounts
  port: 5432
  name: account_service
  ssl_mode: disable
  connect_timeout: 3s
  max_retries_time: 10s

storage:
  type: "mongodb"

  postgres:
    host: postgres-auth
    port: 5432
    name: account_service
    ssl_mode: "disable"
    connect_timeout: 5s
    max_retries_time: 2s

  mongodb:
    uri: mongodb://mongo-accounts:27017
    name: "accounts_service"
    connect_timeout: 5s


grpc:
  port: 50051
  timeout: 5s

kafka:
  brokers: kafka:29092
  write_timeout: 5s

outbox:
  interval: 10s
  batch_size: 10

bank_gateway:
  failure_rate: 0.2