env: "local"

log:
  level: debug
  output: stdout
  file: logs/app.log

storage:
  type: "mongodb"

  postgres:
    host: postgres-transactions
    port: 5432
    name: transaction_service
    ssl_mode: disable
    connect_timeout: 3s
    max_retries_time: 10s

  mongodb:
    uri: mongodb://mongo-transactions:27017
    name: transactions_service
    connect_timeout: 5s

grpc:
  port: 50051
  timeout: 5s

grpc_client:
  addr: accounts_service:50051

kafka:
  brokers: kafka:29092
  write_timeout: 5s

outbox:
  interval: 10s
  batch_size: 10

recover:
  interval: 10s
  stale_after: 30s